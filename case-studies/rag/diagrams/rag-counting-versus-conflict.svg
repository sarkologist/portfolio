<svg xmlns="http://www.w3.org/2000/svg" width="720" height="708" viewBox="0 0 720 708" role="img" aria-labelledby="title desc">
<title id="title">Correct counting did not ensure disclosure of the source conflict</title><desc id="desc">Selected recorded configurations on the 16-row case. In the paired low-effort batch, low reasoning without the counting tool produced two of three correct counts and zero of three conflict disclosures with both citations; with the counting tool it produced three of three correct counts and one of three conflict disclosures. Medium reasoning with the counting tool also produced three of three correct counts and one of three conflict disclosures. High reasoning without the counting tool produced three of three for both criteria. High and medium effort were evaluated in separate batches. Each row uses three completed answers; low with the tool also had a timeout and retry. This is a small selected case, not a general model ranking.</desc>
<style>text{font-family:"Trebuchet MS",Arial,sans-serif;fill:#303a3d;font-size:26px}.title{font-size:30px;font-weight:700}.label{font-weight:700}.small{font-size:25px}.ink{fill:none;stroke:#485456;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}</style>
