<rect width="720" height="676" fill="#fffdf6"/>
<text x="24" y="44" class="title" text-anchor="start">Recover the linked condition</text>
<text x="24" y="91" class="label" text-anchor="start">BEFORE</text>
<text x="432" y="91" class="label" text-anchor="start">Model context</text>
<rect x="24" y="112" width="272" height="82" rx="8" fill="#f2f1e9" stroke="#a6adab" stroke-width="1.5"/>
<text x="42" y="147" class="label" text-anchor="start">Renewal rule</text>
<text x="42" y="179" class="small" text-anchor="start">See conditions.md</text>
<rect x="24" y="235" width="272" height="68" rx="8" fill="#f5e3c8" stroke="#a6adab" stroke-width="1.5"/>
<text x="42" y="277" class="label" text-anchor="start">Approval required</text>
<path class="ink" d="M160 195 V228" marker-end="url(#arrow)"/>
<text x="176" y="222" class="small" text-anchor="start">link</text>
<rect x="432" y="112" width="264" height="191" rx="8" fill="#f2f1e9" stroke="#a6adab" stroke-width="1.5"/>
<text x="450" y="151" class="label" text-anchor="start">Renewal rule</text>
<text x="450" y="218" class="label" text-anchor="start">Approval absent</text>
<text x="450" y="259" class="small" text-anchor="start">No budget loss</text>
<path class="ink" d="M302 153 H423" marker-end="url(#arrow)"/>
<path class="ink" d="M302 269 H402" stroke-dasharray="6 6"/><path class="ink" d="M393 260 L411 278 M411 260 L393 278"/>
<text x="24" y="353" class="label" text-anchor="start">AFTER   Follow one local link</text>
