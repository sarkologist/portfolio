<text x="42" y="441" class="small" text-anchor="start">See conditions.md</text>
<rect x="24" y="497" width="272" height="68" rx="8" fill="#e4eee8" stroke="#a6adab" stroke-width="1.5"/>
<text x="42" y="539" class="label" text-anchor="start">Approval required</text>
<path class="ink" d="M160 457 V490" marker-end="url(#arrow)"/>
<text x="176" y="484" class="small" text-anchor="start">link</text>
