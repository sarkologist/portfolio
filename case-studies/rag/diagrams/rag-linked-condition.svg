<svg xmlns="http://www.w3.org/2000/svg" width="720" height="676" viewBox="0 0 720 676" role="img" aria-labelledby="title desc">
<title id="title">One-hop retrieval restores a linked approval condition</title><desc id="desc">Before the fix, both documents load but only the renewal rule reaches model context; the linked approval condition is absent, with no context-budget exclusion. After following the direct local link for one hop, both passages reach context. This demonstrates evidence coverage, not generated-answer quality.</desc>
<style>text{font-family:"Trebuchet MS",Arial,sans-serif;fill:#303a3d;font-size:26px}.title{font-size:30px;font-weight:700}.label{font-weight:700}.small{font-size:25px}.ink{fill:none;stroke:#485456;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}</style>
