<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img">
<style>text{font-family:"Trebuchet MS",sans-serif;fill:#303a3d;font-size:21px}.title{font-size:28px;font-weight:bold}.small{font-size:17px}.label{font-size:23px;font-weight:bold}.ink{fill:none;stroke:#485456;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#485456" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="520" fill="#fffdf6"/>
<title>Schematic: gather similarly valued files and promote their shelf through a ranking</title><text x="40" y="48" class="title" text-anchor="start">The shelf: carry a group through the ranking</text><text x="40" y="82" class="small" text-anchor="start">Letters stand for files; positions show relative rating, not folders.</text><text x="42" y="153" class="label" text-anchor="start">1. Gather similar files</text><text x="550" y="153" class="label" text-anchor="start">2. Promote the group together</text><path class="ink" d="M55 384 Q245 380 432 384" marker-end="url(#arrow)"/><path class="ink" d="M556 384 Q742 381 955 384" marker-end="url(#arrow)"/><text x="55" y="417" class="small" text-anchor="start">Lower-rated</text><text x="330" y="417" class="small" text-anchor="start">Higher-rated</text><text x="555" y="417" class="small" text-anchor="start">Lower-rated</text><text x="830" y="417" class="small" text-anchor="start">Higher-rated</text><path d="M145 240 L205 238 L207 304 L144 306 Z" fill="#e4eee8" stroke="#485456" stroke-width="2"/><text x="175" y="281" class="label" text-anchor="middle">A</text><path d="M220 240 L280 238 L282 304 L219 306 Z" fill="#e4eee8" stroke="#485456" stroke-width="2"/><text x="250" y="281" class="label" text-anchor="middle">B</text><path d="M295 240 L355 238 L357 304 L294 306 Z" fill="#e4eee8" stroke="#485456" stroke-width="2"/><text x="325" y="281" class="label" text-anchor="middle">C</text><path class="ink" d="M133 224 L133 319 Q245 325 372 319 L372 224"/><text x="246" y="353" class="small" text-anchor="middle">Temporary shelf</text><path class="ink" d="M413 267 Q465 244 515 267" marker-end="url(#arrow)"/><path d="M710 240 L770 238 L772 304 L709 306 Z" fill="#e4eee8" stroke="#485456" stroke-width="2"/><text x="740" y="281" class="label" text-anchor="middle">A</text><path d="M785 240 L845 238 L847 304 L784 306 Z" fill="#e4eee8" stroke="#485456" stroke-width="2"/><text x="815" y="281" class="label" text-anchor="middle">B</text><path d="M860 240 L920 238 L922 304 L859 306 Z" fill="#e4eee8" stroke="#485456" stroke-width="2"/><text x="890" y="281" class="label" text-anchor="middle">C</text><path class="ink" d="M697 224 L697 319 Q820 324 935 319 L935 224"/><path class="ink" d="M613 196 Q760 190 914 196" marker-end="url(#arrow)"/><text x="760" y="180" class="small" text-anchor="middle">Promote</text><text x="40" y="476" class="small" text-anchor="start">Add a file when it seems to belong; release it when it reaches a suitable place.</text></svg>
