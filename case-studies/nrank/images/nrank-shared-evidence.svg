<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img">
<style>text{font-family:"Trebuchet MS",sans-serif;fill:#303a3d;font-size:21px}.title{font-size:28px;font-weight:bold}.small{font-size:17px}.label{font-size:23px;font-weight:bold}.ink{fill:none;stroke:#485456;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#485456" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="520" fill="#fffdf6"/>
<title>Conceptual contrast: overwriting grouped ratings versus two-way evidence that preserves the influence of priors</title><text x="40" y="48" class="title" text-anchor="start">Similarity is evidence — not a replacement rating</text><text x="40" y="83" class="small" text-anchor="start">Each file has its own estimated rating and uncertainty.</text><text x="45" y="139" class="label" text-anchor="start">Old rule: overwrite</text><text x="545" y="139" class="label" text-anchor="start">Chosen rule: update both ways</text><path d="M85 180 L145 178 L147 244 L84 246 Z" fill="#e4eee8" stroke="#485456" stroke-width="2"/><text x="115" y="221" class="label" text-anchor="middle">A</text><path d="M300 180 L360 178 L362 244 L299 246 Z" fill="#f5e3c8" stroke="#485456" stroke-width="2"/><text x="330" y="221" class="label" text-anchor="middle">B</text><text x="115" y="278" class="small" text-anchor="middle">Established belief</text><text x="330" y="278" class="small" text-anchor="middle">Less certain</text><path class="ink" d="M216 295 L216 331" marker-end="url(#arrow)"/><path d="M85 350 L145 348 L147 414 L84 416 Z" fill="#e4eee8" stroke="#485456" stroke-width="2"/><text x="115" y="391" class="label" text-anchor="middle">A</text><path d="M300 350 L360 348 L362 414 L299 416 Z" fill="#e4eee8" stroke="#485456" stroke-width="2"/><text x="330" y="391" class="label" text-anchor="middle">B</text><text x="216" y="446" class="small" text-anchor="middle">Same assigned rating + uncertainty</text><text x="216" y="473" class="small" text-anchor="middle">Earlier distinctions are lost</text><path d="M595 180 L655 178 L657 244 L594 246 Z" fill="#e4eee8" stroke="#485456" stroke-width="2"/><text x="625" y="221" class="label" text-anchor="middle">A</text><path d="M835 180 L895 178 L897 244 L834 246 Z" fill="#f5e3c8" stroke="#485456" stroke-width="2"/><text x="865" y="221" class="label" text-anchor="middle">B</text><path class="ink" d="M675 211 Q743 206 823 211" marker-end="url(#arrow)"/><path class="ink" d="M823 235 Q750 240 675 235" marker-end="url(#arrow)"/><text x="746" y="286" class="small" text-anchor="middle">“These seem similarly good”</text><path class="ink" d="M626 304 L626 331" marker-end="url(#arrow)"/><path class="ink" d="M866 304 L866 331" marker-end="url(#arrow)"/><path d="M595 350 L655 348 L657 414 L594 416 Z" fill="#e4eee8" stroke="#485456" stroke-width="2"/><text x="625" y="391" class="label" text-anchor="middle">A</text><path d="M835 350 L895 348 L897 414 L834 416 Z" fill="#f5e3c8" stroke="#485456" stroke-width="2"/><text x="865" y="391" class="label" text-anchor="middle">B</text><text x="746" y="446" class="small" text-anchor="middle">Prior beliefs still inform the result</text><text x="746" y="473" class="small" text-anchor="middle">Evidence about either can inform both</text><path class="ink" d="M493 127 Q488 302 493 481"/></svg>
